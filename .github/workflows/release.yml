name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v4.0.0 or v4.0.0-rc.1

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Verify tag matches package version
      run: |
        version="$(./eng/read_version.sh)"
        if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
          echo "tag ${GITHUB_REF_NAME} does not match package version ${version} (single source: Hjson/Hjson.csproj)" >&2
          exit 1
        fi

    - name: Restore dependencies
      run: dotnet restore Hjson/Hjson.csproj

    - name: Pack Hjson
      run: dotnet pack Hjson/Hjson.csproj --configuration Release --no-restore -o ./artifacts

    - name: Push to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
